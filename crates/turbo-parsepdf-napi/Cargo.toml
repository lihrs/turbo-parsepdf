[package]
name = "turbo-parsepdf-napi"
description = "N-API binding: the turbo-parsepdf PDF extractor exposed to Node/JS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# cdylib for the Node native addon; rlib so the binding can be unit-tested and
# linked from Rust if ever needed. Mirrors the sibling turbo-xlsx napi crate.
[lib]
crate-type = ["cdylib", "rlib"]
# Validated via the Node conformance harness (__test__/*.test.mjs), not host
# `cargo test` (the addon resolves N-API symbols at load time via Node).
test = false
doctest = false

[dependencies]
# `encrypt` is always on for the addon: password-protected PDFs are part of every
# napi build (the crypto deps are negligible in a native addon).
turbo-parsepdf-core = { path = "../turbo-parsepdf-core", features = ["encrypt"] }
serde = { workspace = true }
serde_json = { workspace = true }
# napi-rs front-end (native addon). `napi6` matches the turbo-* ABI baseline.
napi = { version = "2", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "2"

# Faster small-allocation churn for the parse hot path (many short Strings/Vecs).
# NOT on musl: a statically-linked mimalloc segfaults during init when the addon
# is dlopen'd by a musl-libc Node, so musl falls back to the system allocator.
[target.'cfg(not(target_env = "musl"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[build-dependencies]
napi-build = "2"
