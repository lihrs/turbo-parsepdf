[package]
name = "turbo-parsepdf-py"
description = "PyO3 binding: the turbo-parsepdf PDF extractor exposed to Python (PyPI: turbo-parsepdf)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# cdylib for the Python extension module (maturin packages it); rlib so the
# binding still type-checks and links on the host for clippy/cc-check without the
# Python interpreter. Mirrors the proven turbo-parsepdf-napi crate layout.
[lib]
name = "turbo_parsepdf_py"
crate-type = ["cdylib", "rlib"]
# No host-testable Rust surface: the test harness can't link (extension-module
# drops libpython). Validated via Python (maturin wheel), not `cargo test`.
test = false
doctest = false

[dependencies]
# `encrypt` always on: password-protected PDFs are read by every wheel.
turbo-parsepdf-core = { path = "../turbo-parsepdf-core", features = ["encrypt"] }
serde = { workspace = true }
serde_json = { workspace = true }
# PyO3 0.23 keeps a Rust MSRV the workspace's 1.88 satisfies; `abi3-py38` yields a
# single stable-ABI wheel that loads on CPython 3.8+. `extension-module` drops the
# libpython link so the wheel is portable (and `cargo build` works host-side).
pyo3 = { version = "0.23", default-features = false, features = [
    "extension-module",
    "abi3-py38",
    "macros",
] }
# Bridge a Python object <-> serde_json::Value with no JSON-string round-trip.
pythonize = "0.23"
