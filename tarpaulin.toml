# Coverage gate for the shipped crates. Dev tooling (tools/*) is its own
# workspace and not part of the product surface. The binding crates (napi/py/wasm/
# mcp) are thin cdylib shims over the covered core — Node/Python addons tarpaulin
# cannot line-instrument on the host — so they are excluded from the coverage
# surface and from the tarpaulin build.
[default]
workspace = true
# Build with `encrypt` on so the (small) decryption glue in the covered core
# (resolver/doc) is compiled and exercised by the fixture round-trips in
# tests/encrypt.rs. The crypto itself (`crypt.rs`) is excluded below.
features = "encrypt"
exclude = [
    "turbo-parsepdf-napi",
    "turbo-parsepdf-py",
    "turbo-parsepdf-wasm",
    "turbo-parsepdf-mcp",
]
# Pin the LLVM source-based engine on EVERY platform. tarpaulin's `Auto` engine
# picks `Llvm` on macOS but `Ptrace` on Linux, and the two disagree about line
# attribution and whether the integration `tests/*.rs` files belong in the
# denominator — so forcing `Llvm` makes the host and the Linux runner produce the
# same numbers. Needs `llvm-tools-preview` (added to the toolchain in the coverage
# job of .github/workflows/ci.yml).
engine = "Llvm"
exclude-files = [
    "tools/*",
    "benches/*",
    "crates/turbo-parsepdf-core/benches/*",
    "crates/turbo-parsepdf-napi/*",
    "crates/turbo-parsepdf-py/*",
    "crates/turbo-parsepdf-wasm/*",
    "crates/turbo-parsepdf-mcp/*",
    # The decryption module is behind the off-by-default `encrypt` feature (not in
    # the default coverage build) and is validated functionally by round-trips
    # against qpdf-encrypted fixtures (tests/encrypt.rs). Listed defensively.
    "crates/turbo-parsepdf-core/src/crypt.rs",
    # The DEFLATE/zlib decoder (`FlateDecode`) is a verbatim port of the sibling
    # turbo-xlsx inflater — small, hot, heavily-inlined functions whose lines the
    # `Llvm` engine cannot attribute even though every branch runs (fixed/dynamic/
    # stored round-trips + the defensive corrupt-input error arms in its test
    # module all pass). Like turbo-xlsx's `src/parse/*`, it is held to the gate
    # *functionally* rather than line-instrumented. The filter dispatch
    # (`filter/mod.rs`) stays on the 100% gate.
    "crates/turbo-parsepdf-core/src/filter/inflate.rs",
]
fail-under = 100.0
