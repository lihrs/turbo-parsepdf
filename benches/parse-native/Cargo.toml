# Standalone bench crate (own workspace) so the Rust-competitor deps never enter
# the product workspace. Compares turbo-parsepdf against the Rust PDF stack.
[workspace]

[package]
name = "parse-native-bench"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
turbo-parsepdf-core = { path = "../../crates/turbo-parsepdf-core" }
pdf-extract = "0.7"
lopdf = "0.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
